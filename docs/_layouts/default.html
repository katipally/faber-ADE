<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if page.title and page.url != "/index.html" and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ '/index.html' | relative_url }}"><img class="logo" src="{{ '/assets/icon.png' | relative_url }}" alt="" width="24" height="24">Faber</a>
  <a class="gh" href="https://github.com/katipally/faber-ADE">GitHub</a>
</header>
<div class="shell">
  <nav class="side" aria-label="Documentation">
    <details open>
      <summary>Menu</summary>
      {% for group in site.data.nav %}
      <p class="group">{{ group.title }}</p>
      <ul>
        {% for item in group.items %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
      {% endfor %}
    </details>
  </nav>
  <main>
    <h1>{{ page.title }}</h1>
    {{ content }}
    <footer>Copyright 2026 Yashwanth Reddy Katipally. <a href="https://github.com/katipally/faber-ADE/blob/main/PRIVACY.md">Privacy</a> / <a href="https://github.com/katipally/faber-ADE/blob/main/LICENSE">License</a></footer>
  </main>
</div>
<script>
if (matchMedia("(max-width: 800px)").matches) document.querySelector(".side details").removeAttribute("open");
</script>
</body>
</html>
